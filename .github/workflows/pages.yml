name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每 15 分鐘抓一次各 repo 的 commit 紀錄；資料沒變就不重新部署
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build data.json
        env:
          # 能讀私有 repo 的 fine-grained PAT（Contents + Metadata 唯讀）。
          # 沒設定時只會列出公開 repo。
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-data.mjs _site/data.json

      - name: Skip deploy when nothing changed
        id: diff
        if: github.event_name == 'schedule'
        run: |
          live=$(curl -fsS "https://${{ github.repository_owner }}.github.io/data.json" | jq -r '.hash // empty' || true)
          next=$(jq -r .hash _site/data.json)
          echo "live=$live next=$next"
          if [ -n "$live" ] && [ "$live" = "$next" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Assemble site
        if: steps.diff.outputs.skip != 'true'
        run: |
          cp index.html skyline.js city.js .nojekyll _site/
          # 瀏覽器會把 .js 快取十分鐘。import 加上版本參數，新版首頁才不會配到舊版模組
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=${GITHUB_SHA::8}'#" _site/index.html _site/city.js
          grep -q "skyline.js?v=" _site/index.html && grep -q "skyline.js?v=" _site/city.js

      - name: Render social preview image
        if: steps.diff.outputs.skip != 'true'
        run: |
          # og.svg → og.png。需要中文字型，否則標題會變成方框
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk > /dev/null
          rsvg-convert -w 1200 _site/og.svg -o _site/og.png
          rm _site/og.svg

      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.skip != 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.skip != 'true'
        with:
          path: _site
      - id: deployment
        if: steps.diff.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
